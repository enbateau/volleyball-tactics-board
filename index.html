    body.expanded{overflow:hidden}
    
    /* サーブ順・交代シート */
    .serve-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(0,0,0,.82);
        overflow-y: auto;
        padding: 12px;
    }
    
    .serve-panel {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px;
        background: #20252b;
        color: #fff;
        border-radius: 12px;
    }
    
    .serve-header,
    .serve-next,
    .serve-history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    
    .serve-header h2 {
        margin: 0;
        font-size: 20px;
    }
    
    .serve-next {
        margin: 14px 0;
        padding: 12px;
        background: #303943;
        border-radius: 9px;
    }
    
    .serve-caption {
        color: #c4cbd2;
        font-size: 12px;
    }
    
    .serve-next-player {
        font-size: 21px;
        font-weight: 800;
        margin-top: 3px;
    }
    
    .serve-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 3px;
    }
    
    .serve-slot {
        display: grid;
        grid-template-columns: 32px 44px minmax(0,1fr) minmax(120px,190px);
        align-items: stretch;
        gap: 6px;
        padding: 4px;
        background: #303943;
        border: 2px solid transparent;
        border-radius: 8px;
        min-height: 0;
    }
    
    .serve-slot.next {
        border-color: #ffe45b;
        background: #3a3a28;
    }
    
    .serve-number {
        font-size: 32px;
        font-weight: 800;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
        margin: 0;
        padding: 2px 0;
    }
    
    .serve-player {
        font-size: 32px;
        font-weight: 700;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        line-height: 1.2;
        margin: 0;
        padding: 2px 0;
    }
    
    .serve-jersey {
        flex: 0 0 auto;
        min-width: 3em;
        text-align: center;
        background: #263e59;
        color: #ffffff;
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 26px;
    }
    
    .serve-name {
        min-width: 0;
        overflow-wrap: anywhere;
    }
    
    .serve-slot select {
        width: 100%;
        min-width: 0;
        font-size: 26px;
        padding: 5px 8px;
        min-height: 0;
        line-height: 1.2;
    }
    
    .serve-section {
        margin-top: 18px;
    }
    
    .serve-section h3 {
        margin: 0 0 8px;
        font-size: 15px;
    }
    
    .serve-bench-list,
    .serve-history-list {
        font-size: 13px;
        line-height: 1.7;
        color: #d5dbe1;
    }
    
    .serve-history-item {
        padding: 5px 0;
        border-bottom: 1px solid #454d56;
    }
    
    @media (max-width: 650px) {
        .serve-panel {
            padding: 10px;
        }
        
        .serve-slot {
            grid-template-columns: 32px 42px minmax(0,1fr) minmax(92px,38%);
            gap: 6px;
            padding: 7px;
        }
        
        .serve-player {
            font-size: 32px;
        }
        
        .serve-slot select {
            font-size: 12px;
            padding: 5px 3px;
        }
        
        .serve-next {
            align-items: flex-start;
        }
        
        .serve-next-player {
            font-size: 18px;
        }
    }
    /* サーブ順のドラッグ操作 */
    .serve-slot {
        position: relative;
        user-select: none;
        -webkit-user-select: none;
    }
    
    .serve-drag-handle {
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-size: 28px;
        padding: 2px;
        line-height: 1;
        border: none;
        background: transparent;
        color: #777;
        min-width: 0;
        min-height: 0;
    }
    
    .serve-slot.dragging {
        opacity: 0.4;
    }
    
    .serve-slot.drag-over {
        outline: 2px solid #2684ff;
        outline-offset: -2px;
    }/* サーブ順シート 大きめ表示 */
    .serve-panel {
        font-size: 26px;
    }
    
    .serve-header h2 {
        font-size: 36px;
    }
    
    .serve-next {
        font-size: 28px;
    }
    
    .serve-next-player {
        font-size: 38px;
        font-weight: bold;
    }
    
    .serve-caption {
        font-size: 24px;
    }
    
    .serve-slot {
        font-size: 30px;
        min-height: 70px;
    }
    
    .serve-number {
        font-size: 32px;
        font-weight: bold;
    }
    
    .serve-player {
        font-size: 32px;
        font-weight: bold;
    }
    
    
    
    .serve-section h3 {
        font-size: 32px;
    }
    
    #serveBench,
    #serveHistory {
        font-size: 24px;
    }
    
    #serveCloseBtn,
    #serveAdvanceBtn,
    #serveClearLogBtn {
        font-size: 26px;
        padding: 14px 20px;
    }

</head><body><header><h1>🏐 9人制バレー 戦術ボード</h1><div><button id="saveBtn">シーン保存</button> <button id="exportBtn">PNG出力</button> <button id="resetBtn">初期配置</button></div></header>
      
      <nav class="tools"><button data-tool="move" class="active">☝ 選択・移動</button><button data-tool="pen">✎ ペン</button><button data-tool="arrow">↗ 矢印</button><button data-tool="erase">消しゴム</button><button id="undoBtn">↶ 戻す</button><button id="clearBtn">描画消去</button><button id="hidePlayersBtn" aria-pressed="false">👁 コート選手を隠す</button><button id="zonesBtn" aria-pressed="false">▦ ゾーン表示</button>
      <button id="expandBtn">⛶ コート全画面</button>
          
          <select id="view">
            <option value="full">全面表示</option>
            <option value="home">自陣・半面</option>
            <option value="away">相手陣・半面</option>

          <select id="color">
            <option value="#fff447">黄ペン</option>
            <option value="#ffffff">白ペン</option>
            <option value="#111827">黒ペン</option>
            <option value="#ef4444">赤ペン</option>

          <button id="serveBtn">☷ サーブ順</button></nav>
      
      <div class="layout"><div class="stage"><div class="fullscreen-controls"><select id="fullView" aria-label="表示範囲"><option value="full">全面表示</option><option value="home">自陣・半面</option><option value="away">相手陣・半面</option></select><button id="fullZonesBtn">▦ ゾーン表示</button><button id="fullHideBtn">👁 選手を隠す</button><button id="exitFullBtn">✕ 戻る</button></div>
          
          <svg id="board" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">

      <defs>
        <!-- コート外の床 -->
        <linearGradient id="floorGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#172536"/>
          <stop offset="48%" stop-color="#26394b"/>
          <stop offset="100%" stop-color="#111c2a"/>
        </linearGradient>

        <!-- コート面 -->
        <linearGradient id="courtGradient" x1="0" y1="0" x2="0.85" y2="1">
          <stop offset="0%" stop-color="#347c75"/>
          <stop offset="48%" stop-color="#4b9b8e"/>
          <stop offset="100%" stop-color="#28665f"/>
        </linearGradient>

        <!-- コート中央の柔らかな光 -->
        <radialGradient id="courtGlow">
          <stop offset="0%" stop-color="#b0ead9" stop-opacity=".20"/>
          <stop offset="100%" stop-color="#b0ead9" stop-opacity="0"/>
        </radialGradient>
        <!-- 選手駒 -->
        <linearGradient id="playerBlue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#69c5ff"/>
          <stop offset="100%" stop-color="#1265b4"/>
        </linearGradient>

        <linearGradient id="playerRed" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff9296"/>
          <stop offset="100%" stop-color="#bd3047"/>
        </linearGradient>

        <linearGradient id="playerYellow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff19a"/>
          <stop offset="100%" stop-color="#e6ad27"/>
        </linearGradient>

        <!-- ボール -->
        <radialGradient id="ballGradient" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#fff8b0"/>
          <stop offset="65%" stop-color="#f3d64c"/>
          <stop offset="100%" stop-color="#d7a91d"/>
        </radialGradient>

        <!-- ネット -->
        <linearGradient id="netGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8195a5"/>
          <stop offset="100%" stop-color="#26394b"/>
        </linearGradient>

        <filter id="selectedGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <marker id="arrowhead"
          markerWidth="9" markerHeight="9"
          refX="7" refY="4"
          orient="auto"
          markerUnits="userSpaceOnUse">

      // ===== サーブ順・交代シート =====

function serveEscape(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}

function ensureServeData() {
  const homePlayers = data.players.filter(p => p.team === 'home');
  const validIds = new Set(homePlayers.map(p => p.id));

  if (!Array.isArray(data.serveOrder)) {
    data.serveOrder = homePlayers.slice(0, 9).map(p => p.id);
  }

  // 存在しない選手IDや重複を除去
  data.serveOrder = data.serveOrder.filter(
    (id, index, arr) =>
      validIds.has(id) && arr.indexOf(id) === index
  );

  // 9人に満たない場合は未登録の選手を補充
  for (const p of homePlayers) {
    if (data.serveOrder.length >= 9) break;
    if (!data.serveOrder.includes(p.id)) {
      data.serveOrder.push(p.id);
    }
  }

  data.serveOrder = data.serveOrder.slice(0, 9);

  if (!Number.isInteger(data.nextServer)) {
    data.nextServer = 0;
  }

  data.nextServer = Math.max(
    0,
    Math.min(8, data.nextServer)
  );

  if (!Array.isArray(data.subLog)) {
    data.subLog = [];
  }
}

function servePlayerName(player) {
  if (!player) return '未登録';
  return `#${player.number} ${player.name}`;
}

function renderServeSheet() {
  ensureServeData();

  const homePlayers = data.players.filter(
    p => p.team === 'home'
  );

  const orderPlayers = data.serveOrder.map(id =>
    homePlayers.find(p => p.id === id)
  );

  const nextPlayer = orderPlayers[data.nextServer];

  $('serveNextPlayer').textContent =
    servePlayerName(nextPlayer);

  // サーブ順1〜9番
  $('serveRows').innerHTML = orderPlayers.map(
    (player, i) => {
      const bench = homePlayers.filter(
        p => !data.serveOrder.includes(p.id)
      );

      const options = [
        '<option value="">交代する選手を選択</option>',
        ...bench.map(p =>
          `<option value="${serveEscape(p.id)}">` +
          `${serveEscape(servePlayerName(p))}</option>`
        )
      ].join('');

      return `
        <div class="serve-slot ${i === data.nextServer ? 'next' : ''}"
             data-player-id="${serveEscape(player.id)}">

          <button type="button"
                  class="serve-drag-handle"
                  aria-label="ドラッグして順番を変更">⠿</button>

          <div class="serve-number">${i + 1}</div>

        <div class="serve-player">
          <span class="serve-jersey">
            #${serveEscape(player.number)}
          </span>
          <span class="serve-name">
            ${serveEscape(player.name)}
          </span>
        </div>
          <select data-serve-slot="${i}">
            ${options}
          </select>

        </div>
      `;
    }
  ).join('');

  // 控え選手一覧
  const benchPlayers = homePlayers.filter(
    p => !data.serveOrder.includes(p.id)
  );

  $('serveBench').innerHTML =
    `<div class="serve-bench-list">${
      benchPlayers.length
        ? benchPlayers.map(p =>
            serveEscape(servePlayerName(p))
          ).join('　／　')
        : '控え選手なし'
    }</div>`;

  // 交代履歴
  $('serveHistory').innerHTML =
    `<div class="serve-history-list">${
      data.subLog.length
        ? data.subLog.slice().reverse().map(log =>
            `<div class="serve-history-item">` +
            `${serveEscape(log.time)}　` +
            `${serveEscape(log.message)}</div>`
          ).join('')
        : '交代履歴はありません'
    }</div>`;
}

// サーブ順のドラッグ入れ替え
let serveDraggingRow = null;

$('serveRows').addEventListener('pointerdown', event => {
  const handle = event.target.closest('.serve-drag-handle');
  if (!handle) return;

  serveDraggingRow = handle.closest('.serve-slot');
  if (!serveDraggingRow) return;

  event.preventDefault();
  serveDraggingRow.classList.add('dragging');
});

document.addEventListener('pointermove', event => {
  if (!serveDraggingRow) return;

  event.preventDefault();

  const target = document
    .elementFromPoint(event.clientX, event.clientY)
    ?.closest('.serve-slot');

  if (!target || target === serveDraggingRow) return;

  const rect = target.getBoundingClientRect();
  const middle = rect.top + rect.height / 2;

  if (event.clientY < middle) {
    $('serveRows').insertBefore(
      serveDraggingRow,
      target
    );
  } else {
    $('serveRows').insertBefore(
      serveDraggingRow,
      target.nextSibling
    );
  }
}, { passive: false });

function finishServeDrag(cancelled = false) {
  if (!serveDraggingRow) return;

  serveDraggingRow.classList.remove('dragging');

  serveDraggingRow = null;

  if (cancelled) {
    renderServeSheet();
    return;
  }

  const newOrder = Array.from(
    $('serveRows').querySelectorAll('.serve-slot')
  ).map(row => row.dataset.playerId);

  const oldOrder = data.serveOrder.slice();

  if (newOrder.join('|') === oldOrder.join('|')) {
    renderServeSheet();
    return;
  }

  // 次のサーバーは同じ選手のまま維持
  const nextPlayerId = oldOrder[data.nextServer];

  snapshot();

  data.serveOrder = newOrder;

  data.nextServer = newOrder.indexOf(nextPlayerId);

  persist();

  renderServeSheet();
}

document.addEventListener('pointerup', () => {
  finishServeDrag(false);
});

document.addEventListener('pointercancel', () => {
  finishServeDrag(true);
});// 交代処理
$('serveRows').addEventListener('change', event => {
  const select = event.target.closest('select[data-serve-slot]');
  if (!select || !select.value) return;

  ensureServeData();

  const slot = Number(select.dataset.serveSlot);
  const incomingId = select.value;
  const outgoingId = data.serveOrder[slot];

  const incoming = data.players.find(p => p.id === incomingId);
  const outgoing = data.players.find(p => p.id === outgoingId);

  if (!incoming || !outgoing) {
    renderServeSheet();
    return;
  }

  // すでにコート内にいる選手は交代対象にしない
  if (data.serveOrder.includes(incomingId)) {
    renderServeSheet();
    return;
  }

  snapshot();

  // コート上の位置を交換する
  const oldX = outgoing.x;
  const oldY = outgoing.y;

  outgoing.x = incoming.x;
  outgoing.y = incoming.y;

  incoming.x = oldX;
  incoming.y = oldY;

  // サーブ順の枠は維持して選手だけ交代
  data.serveOrder[slot] = incomingId;

  const now = new Date();
  const time = now.toLocaleTimeString('ja-JP', {
    hour: '2-digit',
    minute: '2-digit'
  });

  data.subLog.push({
    time,
    message:
      `${slot + 1}番：${servePlayerName(outgoing)} → ${servePlayerName(incoming)}`
  });

  // 履歴は直近30件まで
  data.subLog = data.subLog.slice(-30);

  persist();
  renderServeSheet();
  render();
});

// 次のサーバーへ
$('serveAdvanceBtn').addEventListener('click', () => {
  ensureServeData();
  snapshot();

  data.nextServer = (data.nextServer + 1) % 9;

  persist();
  renderServeSheet();
});

// 履歴クリア
$('serveClearLogBtn').addEventListener('click', () => {
  ensureServeData();
  snapshot();

  data.subLog = [];

  persist();
  renderServeSheet();
});

// シートを開く
$('serveBtn').addEventListener('click', () => {
  renderServeSheet();
  $('serveSheet').style.display = 'block';
});

// シートを閉じる
$('serveCloseBtn').addEventListener('click', () => {
  $('serveSheet').style.display = 'none';
