    button, select {
        background: linear-gradient(145deg, #405a73 0%, #2b4057 100%);
        border: 1px solid #607b94;
        box-shadow: 0 2px 5px #0004;
        transition: background .15s, border-color .15s;
    }
    
    /* 通常ボタンの青色ハイライト */
    button.active:not(.color-swatch),
    button:not(:disabled):active:not(.color-swatch) {
      background: linear-gradient(135deg, #35a9ec 0%, #1768a9 100%);
      border-color: #9cddff;
      box-shadow: 0 0 9px #35a9ec55;
    }
        /* 全ボタン共通：押下アニメーション */
        button:not(:disabled) {
          transition:
            transform 0.12s ease,
            background 0.15s ease,
            border-color 0.15s ease,
            box-shadow 0.12s ease;
        }

        /* 通常ボタン：押下中・選択中 */
        button:not(:disabled):active:not(.color-swatch),
        button:not(:disabled).active:not(.color-swatch) {
          transform: translateY(2px) scale(0.97);
          box-shadow:
            inset 0 2px 4px rgba(0,0,0,0.35),
            0 0 9px #35a9ec55;
        }

        /* カラースウォッチ：色を変えずに沈み込む */
        button.color-swatch:not(:disabled):active,
        button.color-swatch.selected {
          transform: translateY(2px) scale(0.97);
          box-shadow: none;
        }

function serveEscape(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}

function ensureServeData() {
  const homePlayers = data.players.filter(p => p.team === 'home');
  const validIds = new Set(homePlayers.map(p => p.id));

  if (!Array.isArray(data.serveOrder)) {
    data.serveOrder = homePlayers.slice(0, 9).map(p => p.id);
  }

  // 存在しない選手IDや重複を除去
  data.serveOrder = data.serveOrder.filter(
    (id, index, arr) =>
      validIds.has(id) && arr.indexOf(id) === index
  );

  // 9人に満たない場合は未登録の選手を補充
  for (const p of homePlayers) {
    if (data.serveOrder.length >= 9) break;
    if (!data.serveOrder.includes(p.id)) {
      data.serveOrder.push(p.id);
    }
  }

  data.serveOrder = data.serveOrder.slice(0, 9);

  if (!Number.isInteger(data.nextServer)) {
    data.nextServer = 0;
  }

  data.nextServer = Math.max(
    0,
    Math.min(8, data.nextServer)
  );

  if (!Array.isArray(data.subLog)) {
    data.subLog = [];
  }
}

function servePlayerName(player) {
  if (!player) return '未登録';
  return `#${player.number} ${player.name}`;
}

function renderServeSheet() {
  ensureServeData();

  const homePlayers = data.players.filter(
    p => p.team === 'home'
  );

  const orderPlayers = data.serveOrder.map(id =>
    homePlayers.find(p => p.id === id)
  );

  const nextPlayer = orderPlayers[data.nextServer];

  $('serveNextPlayer').textContent =
    servePlayerName(nextPlayer);

  // サーブ順1〜9番
  $('serveRows').innerHTML = orderPlayers.map(
    (player, i) => {
      const bench = homePlayers.filter(
        p => !data.serveOrder.includes(p.id)
      );

      const options = [
        '<option value="">交代</option>',
        ...bench.map(p =>
          `<option value="${serveEscape(p.id)}">` +
          `${serveEscape(servePlayerName(p))}</option>`
        )
      ].join('');

      return `
        <div class="serve-slot ${i === data.nextServer ? 'next' : ''}"
             data-player-id="${serveEscape(player.id)}">

          <button type="button"
                  class="serve-drag-handle"
                  aria-label="ドラッグして順番を変更">⠿</button>

          <div class="serve-number">${i + 1}</div>

        <div class="serve-player">
          <span class="serve-jersey">
            #${serveEscape(player.number)}
          </span>
          <span class="serve-name">
            ${serveEscape(player.name)}
          </span>
        </div>
          <select data-serve-slot="${i}">
            ${options}
          </select>

        </div>
      `;
    }
  ).join('');

  // 控え選手一覧
  const benchPlayers = homePlayers.filter(
    p => !data.serveOrder.includes(p.id)
  );

  $('serveBench').innerHTML =
    `<div class="serve-bench-list">${
      benchPlayers.length
        ? benchPlayers.map(p =>
            serveEscape(servePlayerName(p))
          ).join('　／　')
        : '控え選手なし'
    }</div>`;

  // 交代履歴
  $('serveHistory').innerHTML =
    `<div class="serve-history-list">${
      data.subLog.length
        ? data.subLog.slice().reverse().map(log =>
            `<div class="serve-history-item">` +
            `${serveEscape(log.time)}　` +
            `${serveEscape(log.message)}</div>`
          ).join('')
        : '交代履歴はありません'
    }</div>`;
}

// サーブ順のドラッグ入れ替え
let serveDraggingRow = null;

$('serveRows').addEventListener('pointerdown', event => {
  const handle = event.target.closest('.serve-drag-handle');
  if (!handle) return;

  serveDraggingRow = handle.closest('.serve-slot');
  if (!serveDraggingRow) return;

  event.preventDefault();
  serveDraggingRow.classList.add('dragging');
});

document.addEventListener('pointermove', event => {
  if (!serveDraggingRow) return;

  event.preventDefault();

  const target = document
    .elementFromPoint(event.clientX, event.clientY)
    ?.closest('.serve-slot');

  if (!target || target === serveDraggingRow) return;

  const rect = target.getBoundingClientRect();
  const middle = rect.top + rect.height / 2;

  if (event.clientY < middle) {
    $('serveRows').insertBefore(
      serveDraggingRow,
      target
    );
  } else {
    $('serveRows').insertBefore(
      serveDraggingRow,
      target.nextSibling
    );
  }
}, { passive: false });

function finishServeDrag(cancelled = false) {
  if (!serveDraggingRow) return;

  serveDraggingRow.classList.remove('dragging');

  serveDraggingRow = null;

  if (cancelled) {
    renderServeSheet();
    return;
  }

  const newOrder = Array.from(
    $('serveRows').querySelectorAll('.serve-slot')
  ).map(row => row.dataset.playerId);

  const oldOrder = data.serveOrder.slice();

  if (newOrder.join('|') === oldOrder.join('|')) {
    renderServeSheet();
    return;
  }

  // 次のサーバーは同じ選手のまま維持
  const nextPlayerId = oldOrder[data.nextServer];

  snapshot();

  data.serveOrder = newOrder;

  data.nextServer = newOrder.indexOf(nextPlayerId);

  persist();

  renderServeSheet();
}

document.addEventListener('pointerup', () => {
  finishServeDrag(false);
});

document.addEventListener('pointercancel', () => {
  finishServeDrag(true);
});// 交代処理
$('serveRows').addEventListener('change', event => {
  const select = event.target.closest('select[data-serve-slot]');
  if (!select || !select.value) return;

  ensureServeData();

  const slot = Number(select.dataset.serveSlot);
  const incomingId = select.value;
  const outgoingId = data.serveOrder[slot];

  const incoming = data.players.find(p => p.id === incomingId);
  const outgoing = data.players.find(p => p.id === outgoingId);

  if (!incoming || !outgoing) {
    renderServeSheet();
    return;
  }

  // すでにコート内にいる選手は交代対象にしない
  if (data.serveOrder.includes(incomingId)) {
    renderServeSheet();
    return;
  }

  snapshot();

  // コート上の位置を交換する
  const oldX = outgoing.x;
  const oldY = outgoing.y;

  outgoing.x = incoming.x;
  outgoing.y = incoming.y;

  incoming.x = oldX;
  incoming.y = oldY;

  // サーブ順の枠は維持して選手だけ交代
  data.serveOrder[slot] = incomingId;

  const now = new Date();
  const time = now.toLocaleTimeString('ja-JP', {
    hour: '2-digit',
    minute: '2-digit'
  });

  data.subLog.push({
    time,
    message:
      `${slot + 1}番：${servePlayerName(outgoing)} → ${servePlayerName(incoming)}`
  });

  // 履歴は直近30件まで
  data.subLog = data.subLog.slice(-30);

  persist();
  renderServeSheet();
  render();
});
// 選手ボックスをタップしてサーバーを指定
$('serveRows').addEventListener('click', event => {

  // 交代プルダウンやドラッグ取っ手の操作は除外
  if (event.target.closest('select, .serve-drag-handle')) return;

  const row = event.target.closest('.serve-slot');
  if (!row) return;

  ensureServeData();

  const playerId = row.dataset.playerId;
  const index = data.serveOrder.indexOf(playerId);

  if (index < 0 || index === data.nextServer) return;

  snapshot();

  data.nextServer = index;

  persist();
  renderServeSheet();
});

function sceneList() {
  const el = $('scenes');
  el.replaceChildren();

  scenes.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'scene';

    // シーン名：直接編集
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'scene-name';
    nameInput.value = s.name;
    nameInput.setAttribute('aria-label', `シーン名 ${i + 1}`);
    nameInput.autocomplete = 'off';
    nameInput.spellcheck = false;

    // タップすると文字全体を選択
    nameInput.addEventListener('focus', () => {
      nameInput.select();
    });

    // Enterで編集確定、Escで編集取消
    nameInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        nameInput.blur();
      }

      if (event.key === 'Escape') {
        nameInput.value = s.name;
        nameInput.blur();
      }
    });

    // 編集内容を保存
    nameInput.addEventListener('change', () => {
      const oldName = s.name;
      const newName = nameInput.value.trim();

      if (!newName) {
        nameInput.value = oldName;
        return;
      }

      if (newName === oldName) return;

      s.name = newName;

      try {
        localStorage.setItem(
          'vb9-scenes',
          JSON.stringify(scenes)
        );
      } catch (error) {
        s.name = oldName;
        nameInput.value = oldName;
        console.warn(error);
        alert('シーン名を保存できませんでした');
      }
    });

    // 表示ボタン
    const load = document.createElement('button');
    load.type = 'button';
    load.className = 'scene-load';
    load.textContent = '表示';
    load.title = 'このシーンを表示する';

    load.onclick = () => {
      snapshot();
      data = clone(s.data);

      if (!data.ball) data.ball = { x: 450, y: 500 };
      if (typeof data.title !== 'string') data.title = '';

      $('matchTitle').value = data.title;

      persist();
      select(null);
    };

    // 削除ボタン
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'scene-delete';
    del.textContent = '×';
    del.title = '削除';

    del.onclick = () => {
      if (confirm('このシーンを削除しますか？')) {
        scenes.splice(i, 1);

        try {
          localStorage.setItem(
            'vb9-scenes',
            JSON.stringify(scenes)
          );
        } catch (error) {
          console.warn(error);
        }

        sceneList();
      }
    };

    row.append(nameInput, load, del);
    el.append(row);
  });
}

$('backupBtn').onclick = () => {
  const backup = {
    version: 1,
    savedAt: new Date().toISOString(),
    data: clone(data),
    scenes: clone(scenes)
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: 'application/json' }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = 'volleyball9-backup.json';
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

// データ復元
$('restoreBtn').onclick = () => {

$('restoreFile').onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const backup = JSON.parse(await file.text());

    if (
      backup.version !== 1 ||
      !backup.data ||
      !Array.isArray(backup.data.players) ||
      !Array.isArray(backup.scenes)
    ) {
      throw new Error('バックアップ形式が違います');
    }

    if (!confirm('現在のデータをバックアップの内容で置き換えますか？')) {
      event.target.value = '';
      return;
    }

    snapshot();

    data = clone(backup.data);
    scenes = clone(backup.scenes);

    if (!data.ball) data.ball = { x: 450, y: 500 };
    if (typeof data.title !== 'string') data.title = '';

    localStorage.setItem('vb9-scenes', JSON.stringify(scenes));
    persist();

    $('matchTitle').value = data.title;
    sceneList();
    select(null);
    render();

    alert('データを復元しました');

  } catch (error) {
    alert('読み込みに失敗しました。バックアップファイルを確認してください。');
    console.warn(error);
  }

  event.target.value = '';
};
